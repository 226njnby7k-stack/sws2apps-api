services:
  api:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - STORAGE_PATH=/data/storage
      - SEC_ENCRYPT_KEY=${SEC_ENCRYPT_KEY}
    volumes:
      - organized_data:/data/storage
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  organized_data:
  caddy_data:
  caddy_config:
